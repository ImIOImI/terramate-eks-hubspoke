name: "Setup Terramate + OpenTofu"
description: "Install pinned Terramate GA .deb and a symbols-capable OpenTofu built from source."

inputs:
  terramate_version:
    description: "Terramate GA version to install"
    default: "0.17.1"
  opentofu_ref:
    description: >
      Git ref of opentofu/opentofu to build `tofu` from. SPIKE: the
      symbol_libraries experiment is not in any stable release or published
      nightly yet (nightlies from 20260825 onward will carry it), so CI builds
      tofu from source. Default pins the commit that merged the experiment
      (#4474, 2026-08-24). Swap to a nightly URL or a release once symbols
      stabilize.
    default: "5097d2de3a2c36c66f43b7f0e2f07cd82882a32e"

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - name: Cache OpenTofu source build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.local/bin/tofu
        key: opentofu-src-${{ inputs.opentofu_ref }}-${{ runner.os }}

    - name: Build symbols-capable OpenTofu from source
      shell: bash
      env:
        OPENTOFU_REF: ${{ inputs.opentofu_ref }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        if [ -x "$HOME/.local/bin/tofu" ]; then
          echo "using cached tofu build"
        else
          rm -rf /tmp/opentofu-src && mkdir -p /tmp/opentofu-src && cd /tmp/opentofu-src
          git init -q
          git remote add origin https://github.com/opentofu/opentofu.git
          git fetch -q --depth 1 origin "$OPENTOFU_REF"
          git checkout -q FETCH_HEAD
          CGO_ENABLED=0 go build -o "$HOME/.local/bin/tofu" ./cmd/tofu
        fi
        "$HOME/.local/bin/tofu" version

    - name: Install Terramate GA
      shell: bash
      run: |
        # GA releases are published to GitHub Releases (NOT the Terramate APT repo,
        # which carries only Catalyst beta builds). Asset naming: linux_amd64.deb.
        # URL verified 2026-07-09: HTTP 200 for v0.17.1.
        VER="${{ inputs.terramate_version }}"
        curl -fsSL -o /tmp/terramate.deb \
          "https://github.com/terramate-io/terramate/releases/download/v${VER}/terramate_${VER}_linux_amd64.deb"
        sudo dpkg -i /tmp/terramate.deb
        terramate version
