apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app.kubernetes.io/name: hello-world
    env: {{ .Values.env | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
        env: {{ .Values.env | quote }}
    spec:
      containers:
        - name: hello
          image: {{ .Values.image }}
          ports:
            - containerPort: 80
          env:
            - name: CLUSTER_ENV
              value: {{ .Values.env | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
