# Argo Rollouts canary: proves progressive delivery on a spoke (needs the
# argo-rollouts controller, which the hub deploys alongside it).
# rollouts-demo ships one image tag per colour; change the overlay's colour to
# watch a canary step through 50% -> pause -> 100%.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-rollout
  labels:
    app.kubernetes.io/name: hello-rollout
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-rollout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: hello-rollout
spec:
  selector:
    app.kubernetes.io/name: hello-rollout
  ports:
    - port: 80
      targetPort: 8080
