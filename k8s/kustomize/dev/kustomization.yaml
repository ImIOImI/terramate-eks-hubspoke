# dev overlay on ../default. Selected for spokes whose cluster secret carries
# overlay=dev (ci-dev locally; set k8s_overlay in _scaffold-cluster.tm.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default
labels:
  - pairs:
      overlay: dev
    includeSelectors: false
patches:
  - target: { kind: Deployment, name: hello-world }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 1 }
      - { op: replace, path: /spec/template/spec/containers/0/args/3, value: dev }
  - target: { group: argoproj.io, kind: Rollout, name: hello-rollout }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 2 }
      - { op: replace, path: /spec/template/spec/containers/0/image, value: "argoproj/rollouts-demo:blue" }
      - { op: replace, path: /spec/strategy/canary/steps/1/pause/duration, value: 10s }
