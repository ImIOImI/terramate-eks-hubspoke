# The Argo Rollouts controller on every registered spoke (any cluster secret
# with an `env` label -- argocd-spoke writes it; the hub's in-cluster has none).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argo-rollouts
spec:
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: Exists }
  template:
    metadata:
      name: "argo-rollouts-{{name}}"
    spec:
      project: default
      source:
        repoURL: https://argoproj.github.io/argo-helm
        chart: argo-rollouts
        targetRevision: 2.43.12
        helm:
          releaseName: argo-rollouts
      destination:
        server: "{{server}}"
        namespace: argo-rollouts
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry:
          limit: 10
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
