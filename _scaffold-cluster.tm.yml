# ============================================================================
# eks-cluster BundleInstance — the full per-account stack tree from one scaffold
# via environments (bootstrap folded in from the former account-bootstrap bundle).
#
#   infra  -> role: hub    oidc_entry: true   (ArgoCD hub + GitHub OIDC entry)
#   dev    -> role: spoke  (hub_env: infra)
#   prd    -> role: spoke  (hub_env: infra)
#   ci-hub -> role: hub    oidc_entry: true   (local MiniStack; stands alone)
#
# Each environment fans out to five stacks: bootstrap -> network -> cluster ->
# nodes -> provisioning. Spoke provisioning also runs AFTER hub provisioning (the
# hub ArgoCD + cluster-secret target must exist first); non-entry bootstraps run
# AFTER the oidc_entry account's bootstrap.
#
# `deploy_role_arn` (per env, optional): leave empty to have bootstrap create
# tmhs-deploy and trust the caller; set it to adopt an existing role and skip
# bootstrap (that role must already exist and be assumable by your identity).
#
# ── STACK IDS ───────────────────────────────────────────────────────────────
# There is no *_stack_id wiring here any more. Stack ids are derived from stack
# paths by make/stack-ids.sh and seeded into each stack.tm.hcl by
# `make stacks`, so the bundle reproduces them with the same formula
# (<env>-eks-<label>) instead of taking them as inputs.
#
# Adding an environment is now just adding a key below, then `make stacks &&
# make generate`. See BOOTSTRAPPING.md.
# ============================================================================
apiVersion: terramate.io/cli/v1
kind: BundleInstance
metadata:
  name: cluster
spec:
  source: /bundles/eks-cluster
  inputs:
    node_instance_types: ["t3.large"]
    node_scaling: { min: 2, max: 3 }
    terraform_modules:
      vpc: { source: "terraform-aws-modules/vpc/aws", version: "6.6.1" }
      eks: { source: "terraform-aws-modules/eks/aws", version: "21.24.0" }
    addon_versions:
      kube-proxy: "v1.33.10-eksbuild.13"
      vpc-cni: "v1.22.2-eksbuild.1"
      coredns: "v1.12.4-eksbuild.18"
      aws-ebs-csi-driver: "v1.48.0-eksbuild.2"
      eks-pod-identity-agent: "v1.3.8-eksbuild.2"
    argocd_chart_version: "10.1.2"
    state_backend: local          # bootstrap: flip to s3 after first apply + migrate (BOOTSTRAPPING.md)
    admin_principal_arns: []      # extra principals to trust on the deploy role (e.g. an SSO role)
environments:
  infra:
    inputs:
      role: hub
      oidc_entry: true            # hosts the GitHub OIDC provider + gha-ci entry role
  dev:
    inputs:
      role: spoke
      hub_env: infra
  prd:
    inputs:
      role: spoke
      hub_env: infra
  # Local MiniStack environment -- hub so it stands alone (no infra dependency).
  # A future ci-spoke would take role: spoke + hub_env: ci-hub, sharing this
  # same MiniStack endpoint.
  ci-hub:
    inputs:
      role: hub
      oidc_entry: true
