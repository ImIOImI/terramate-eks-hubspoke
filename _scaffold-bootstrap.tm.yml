apiVersion: terramate.io/cli/v1
kind: BundleInstance
metadata:
  name: bootstrap
spec:
  source: /bundles/account-bootstrap
  inputs:
    state_backend: local          # flip to s3 after first apply + migrate (README)
    admin_principal_arns: []      # user adds their admin user/role ARN
environments:
  infra: { inputs: { ci_entry: true } }
  dev:   { inputs: { ci_entry: false } }
  prd:   { inputs: { ci_entry: false } }
  # ci-hub is self-contained: it is its own CI entry so it takes no `after` edge
  # on another account's bootstrap, and can be applied on its own against MiniStack.
  ci-hub: { inputs: { ci_entry: true } }
